[project]
name = "careerscout-germany"
version = "1.0.0"
description = "Private German student-job discovery and application workspace"
requires-python = ">=3.11,<3.15"
# Keep these runtime dependencies aligned with requirements.txt for pip users.
dependencies = [
    "streamlit>=1.66,<1.67",
    "fastapi>=0.118,<1",
    "uvicorn[standard]>=0.35,<1",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.13,<5",
    "pydantic>=2.11,<3",
    "SQLAlchemy>=2.0.40,<3",
    "psycopg[binary]>=3.2,<4",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "openpyxl>=3.1,<4",
    "pypdf>=5.4,<7",
    "python-docx>=1.1,<2",
    "python-dotenv>=1.1,<2",
]

[tool.vercel]
entrypoint = "server:app"

[tool.vercel.fastapi.static]
# Keep downloads and uploads behind the workspace authentication middleware.
cdn = false
